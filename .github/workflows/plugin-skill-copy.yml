name: Plugin skill copy
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  identical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: The plugin's guided skill and licence match the originals
        run: |
          cmp skills/co-gp2-to-gp3-guided/SKILL.md plugins/cloudfix/skills/co-gp2-to-gp3-guided/SKILL.md
          cmp LICENSE plugins/cloudfix/LICENSE
