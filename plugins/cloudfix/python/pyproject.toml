[project]
name = "cloudfix"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["boto3"]

[project.scripts]
cloudfix = "cloudfix.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cloudfix"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
